-- -------------------------------------------------------------------
-- File: conky.conf
-- Type: conky main configuration file (Lua format)
-- By Arnold
-- Last modified: 2026-05-13
-- OS: Linux
-- Version: 2
-- -------------------------------------------------------------------
-- Changes from v17:
--   • cpu_avg_samples bumped 2→4 (smoother readings)
--   • Fixed: ${exec xdpyinfo} → ${lua get_resolution} (no shell fork)
--   • Fixed: nvme_temp_color now properly called (needs new lua fn)
--   • GPU section: added usage %, current freq, temperature
--   • Network: labeled session totals, added WiFi SSID + signal bar
--   • System Load: added load graph
-- -------------------------------------------------------------------
-- New Lua functions required in conky.lua:
--   conky_get_nvme_temp_color()  -- was called but never defined
--   conky_get_gpu_freq()         -- reads /sys/class/drm/card0/gt_cur_freq_mhz
--   conky_get_gpu_temp()         -- reads /sys/class/drm/.../hwmon temp
--   conky_get_gpu_temp_color()   -- returns color tag based on GPU temp
-- -------------------------------------------------------------------

conky.config = {
    -- Execution
    background = true,
    update_interval = 2,
    total_run_times = 0,
    cpu_avg_samples = 4,       -- bumped from 2 for smoother per-core readings
    net_avg_samples = 2,
    no_buffers = true,

    -- Window settings
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_colour = '0a0a0a',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Size and position
    alignment = 'top_left',
    gap_x = 10,
    gap_y = 10,
    minimum_width = 450,
    minimum_height = 5,
    maximum_width = 450,

    -- Graphics
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    stippled_borders = 0,
    border_inner_margin = 8,
    border_outer_margin = 0,
    border_width = 1,
    default_bar_width = 100,
    default_bar_height = 8,

    -- Text
    use_xft = true,
    font = 'CascadiaMono NF:size=12',
    xftalpha = 1,
    override_utf8_locale = true,
    uppercase = false,
    short_units = true,
    use_spacer = 'none',
    max_text_width = 0,

    -- Colors (unchanged from v1)
    default_color = 'e0e0e0',
    default_shade_color = '000000',
    default_outline_color = '000000',
    color0 = '00d4ff',      -- Cyan accent (header border)
    color1 = '90ee90',      -- Light green (labels)
    color2 = '4deeea',      -- Bright cyan (section headers)
    color3 = 'ffe66d',      -- Yellow (device names)
    color4 = 'ff6b6b',      -- Red (high / warning)
    color5 = 'ff9f43',      -- Orange (warm / upload)
    color6 = 'ffd93d',      -- Gold (moderate temp)
    color7 = '606060',      -- Gray (dividers / dim text)
    color8 = '74ee15',      -- Bright green (good / download)
    color9 = '404040',      -- Dark gray (graph backgrounds)

    -- Process settings
    top_name_width = 20,
    top_cpu_separate = false,

    -- Lua
    lua_load = '/home/arnold/.config/conky/conky.lua',
}

conky.text = [[
${voffset 4}${color2}┌─ SYSTEM ${color7}${hr 2}
${color1}│ Kernel:${color} ${kernel}${goto 250}${color1}Uptime:${color8} $uptime
${color1}│ Host:${color} $nodename
${color1}│ Distro:${color} ${lua get_distro}
${voffset 2}${color2}┌─ CPU ${color7}${hr 2}
${color1}│ Model:${color} ${lua get_cpu_model}
${color1}│ Arch:${color} ${machine}${goto 250}${color1}Freq:${color5} ${freq_g}GHz
${color1}│ Temp:${lua_parse get_cpu_temp_color} ${lua get_cpu_temp}
${voffset 2}${color1}│ Core 1${color5}${goto 90}${cpubar cpu1 10,110}${color} ${cpu cpu1}%${goto 250}${color1}Core 2${color5}${goto 315}${cpubar cpu2 10,110}${color} ${cpu cpu2}%
${color1}│ Core 3${color5}${goto 90}${cpubar cpu3 10,110}${color} ${cpu cpu3}%${goto 250}${color1}Core 4${color5}${goto 315}${cpubar cpu4 10,110}${color} ${cpu cpu4}%
${color1}│${color9}${alignc}${cpugraph 40,420 303030 4deeea -t}
${voffset 2}${color2}┌─ MEMORY ${color7}${hr 2}
${color1}│ RAM:${color5}${goto 90}${membar 10,200}${color} ${mem} / ${memmax}${alignr}${memperc}%
${color1}│ SWAP:${color6}${goto 90}${swapbar 10,200}${color} ${swap} / ${swapmax}${alignr}${swapperc}%
${voffset 2}${color2}┌─ NETWORK ${color7}${hr 2}
${if_existing /sys/class/net/enp0s31f6/operstate up}\
${color1}│ Cable${goto 90}${color8}▼${color} ${downspeed enp0s31f6}/s${goto 260}${color5}▲${color} ${upspeed enp0s31f6}/s
${color1}│ Session${goto 90}${color8}▼${color} ${lua get_net_rx enp0s31f6}${goto 260}${color5}▲${color} ${lua get_net_tx enp0s31f6}
${color1}│${color9}${goto 30}${downspeedgraph enp0s31f6 40,200 303030 74ee15}${goto 240}${upspeedgraph enp0s31f6 40,200 303030 ff6b6b}\
${else}\
${color1}│ Cable${goto 90}${color4}Disconnected
${color1}│${color9}${goto 30}${downspeedgraph lo 40,200 303030 303030}${goto 240}${upspeedgraph lo 40,200 303030 303030}\
${endif}
${if_existing /sys/class/net/wlp4s0/operstate up}\
${color1}│ WiFi${goto 90}${color8}▼${color} ${downspeed wlp4s0}/s${goto 260}${color5}▲${color} ${upspeed wlp4s0}/s
${color1}│ SSID:${color} ${wireless_essid wlp4s0}${goto 260}${color1}Signal:${color} ${wireless_link_qual_perc wlp4s0}%
${color1}│${color5}${goto 90}${wireless_link_bar 8,200 wlp4s0}
${color1}│ Session${goto 90}${color8}▼${color} ${lua get_wifi_rx}${goto 260}${color5}▲${color} ${lua get_wifi_tx}
${color1}│${color9}${goto 30}${downspeedgraph wlp4s0 40,200 303030 74ee15}${goto 240}${upspeedgraph wlp4s0 40,200 303030 ff6b6b}\
${else}${if_existing /sys/class/net/wlan1/operstate up}\
${color1}│ WiFi${goto 90}${color8}▼${color} ${downspeed wlan1}/s${goto 260}${color5}▲${color} ${upspeed wlan1}/s
${color1}│ SSID:${color} ${wireless_essid wlan1}${goto 260}${color1}Signal:${color} ${wireless_link_qual_perc wlan1}%
${color1}│${color5}${goto 90}${wireless_link_bar 8,200 wlan1}
${color1}│ Session${goto 90}${color8}▼${color} ${lua get_wifi_rx}${goto 260}${color5}▲${color} ${lua get_wifi_tx}
${color1}│${color9}${goto 30}${downspeedgraph wlan1 40,200 303030 74ee15}${goto 240}${upspeedgraph wlan1 40,200 303030 ff6b6b}\
${else}\
${color1}│ WiFi${goto 90}${color4}Disconnected
${color1}│${color9}${goto 30}${downspeedgraph lo 40,200 303030 303030}${goto 240}${upspeedgraph lo 40,200 303030 303030}\
${endif}${endif}
${voffset 2}${color2}┌─ GPU ${color7}${hr 2}
${color1}│ Model:${color} ${lua get_gpu_model}
${color1}│ Vendor:${color} ${lua get_gpu_vendor}${goto 250}${color1}Res:${color} ${lua get_resolution}
${color1}│ Usage:${color} ${lua get_gpu_usage}%${goto 250}${color1}Freq:${color5} ${lua get_gpu_freq} MHz
${color1}│ Temp:${lua_parse get_gpu_temp_color} ${lua get_gpu_temp}
${voffset 2}${color2}┌─ STORAGE ${color7}${hr 2}
${color1}│ Root${goto 90}\
${if_match ${fs_used_perc /} >= 75}${color4}\
${else}${if_match ${fs_used_perc /} >= 50}${color5}\
${else}${color8}${endif}${endif}\
${fs_bar 10,200 /}${color} ${fs_used /} / ${fs_size /}${alignr}${fs_used_perc /}%
${color1}│ Home${goto 90}\
${if_match ${fs_used_perc /home} >= 75}${color4}\
${else}${if_match ${fs_used_perc /home} >= 50}${color5}\
${else}${color8}${endif}${endif}\
${fs_bar 10,200 /home}${color} ${fs_used /home} / ${fs_size /home}${alignr}${fs_used_perc /home}%
${color1}│ Data${goto 90}\
${if_match ${fs_used_perc /srv} >= 75}${color4}\
${else}${if_match ${fs_used_perc /srv} >= 50}${color5}\
${else}${color8}${endif}${endif}\
${fs_bar 10,200 /srv}${color} ${fs_used /srv} / ${fs_size /srv}${alignr}${fs_used_perc /srv}%
${voffset 2}${color2}┌─ DISK I/O ${color7}${hr 2}
${color1}│ ${color3}nvme${goto 90}${color5}▲ ${diskio_write nvme0n1}${goto 200}${color8}▼ ${diskio_read nvme0n1}${goto 310}${lua_parse get_nvme_temp_color}${lua get_nvme_temp}°C${alignr}${color9}${diskiograph nvme0n1 12,70 303030 4deeea -t -l}
${color1}│ ${color3}sda${goto 90}${color5}▲ ${diskio_write sda}${goto 200}${color8}▼ ${diskio_read sda}${goto 310}${color6}${lua get_disk_temp sda}${alignr}${color9}${diskiograph sda 12,70 303030 4deeea -t -l}
${color1}│ ${color3}sdb${goto 90}${color5}▲ ${diskio_write sdb}${goto 200}${color8}▼ ${diskio_read sdb}${goto 310}${color6}${lua get_disk_temp sdb}${alignr}${color9}${diskiograph sdb 12,70 303030 4deeea -t -l}
${color1}│${voffset 2}${alignc}${color2}━━━ Top CPU Usage ━━━
${color1}│ ${color7}NAME${goto 200}PID${goto 270}CPU${goto 350}MEM
${color1}│ ${color}${top name 1}${goto 200}${top pid 1}${goto 260}${color5}${top cpu 1}%${goto 340}${color8}${top mem_res 1}
${color1}│ ${color}${top name 2}${goto 200}${top pid 2}${goto 260}${color5}${top cpu 2}%${goto 340}${color8}${top mem_res 2}
${color1}│ ${color}${top name 3}${goto 200}${top pid 3}${goto 260}${color5}${top cpu 3}%${goto 340}${color8}${top mem_res 3}
${color1}│ ${color}${top name 4}${goto 200}${top pid 4}${goto 260}${color5}${top cpu 4}%${goto 340}${color8}${top mem_res 4}
${color1}│ ${color}${top name 5}${goto 200}${top pid 5}${goto 260}${color5}${top cpu 5}%${goto 340}${color8}${top mem_res 5}
${color1}│${voffset 2}${alignc}${color2}━━━ Top Memory Usage ━━━
${color1}│ ${color7}NAME${goto 200}PID${goto 270}CPU${goto 350}MEM
${color1}│ ${color}${top_mem name 1}${goto 200}${top_mem pid 1}${goto 260}${color5}${top_mem cpu 1}%${goto 340}${color8}${top_mem mem_res 1}
${color1}│ ${color}${top_mem name 2}${goto 200}${top_mem pid 2}${goto 260}${color5}${top_mem cpu 2}%${goto 340}${color8}${top_mem mem_res 2}
${color1}│ ${color}${top_mem name 3}${goto 200}${top_mem pid 3}${goto 260}${color5}${top_mem cpu 3}%${goto 340}${color8}${top_mem mem_res 3}
${color1}│ ${color}${top_mem name 4}${goto 200}${top_mem pid 4}${goto 260}${color5}${top_mem cpu 4}%${goto 340}${color8}${top_mem mem_res 4}
${color1}│ ${color}${top_mem name 5}${goto 200}${top_mem pid 5}${goto 260}${color5}${top_mem cpu 5}%${goto 340}${color8}${top_mem mem_res 5}
${voffset 2}${color2}┌─ SYSTEM LOAD ${color7}${hr 2}
${color1}│ Load Average:${color} ${loadavg 1} ${loadavg 2} ${loadavg 3}${alignr}${color7}(1m 5m 15m)
${color1}│${color9}${alignc}${loadgraph 30,420 303030 4deeea -t}
${color7}${hr 1}
]]
